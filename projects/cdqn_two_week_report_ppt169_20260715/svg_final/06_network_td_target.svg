<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#F8FAFC" />
  <g id="header">
    <text x="56" y="70" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="800" fill="#0B1F3A">最小网络：共享编码器 + GRU 级联 + Double DQN</text>
    <text x="56" y="108" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#475569">先做可训练、可比较的最小版本，不为 24 个信号建立 24 套独立网络。</text>
  </g>
  <g id="architecture">
    <path fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" d="M64,154 H808 A8,8 0 0 1 816,162 V536 A8,8 0 0 1 808,544 H64 A8,8 0 0 1 56,536 V162 A8,8 0 0 1 64,154 Z" />
    <g id="layer-state">
      <path fill="#DBEAFE" stroke="#2563EB" stroke-width="1.2" d="M98,196 H772 A8,8 0 0 1 780,204 V260 A8,8 0 0 1 772,268 H98 A8,8 0 0 1 90,260 V204 A8,8 0 0 1 98,196 Z" />
      
  <g transform="translate(114.0, 214.0) scale(1.4166666666666667)" fill="none" stroke="#2563EB" stroke-width="2">
    <path d="M4 6a8 3 0 1 0 16 0a8 3 0 1 0 -16 0" />
    <path d="M4 6v6a8 3 0 0 0 16 0v-6" />
    <path d="M4 12v6a8 3 0 0 0 16 0v-6" />
  </g>
      <text x="164" y="226" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="800" fill="#0B1F3A">State Encoder</text>
      <text x="164" y="252" font-family="Consolas, Courier New, monospace" font-size="16" fill="#475569">state_dim → 128 → 128, ReLU + LayerNorm</text>
    </g>
    <g id="layer-prefix">
      <path fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" d="M98,300 H772 A8,8 0 0 1 780,308 V364 A8,8 0 0 1 772,372 H98 A8,8 0 0 1 90,364 V308 A8,8 0 0 1 98,300 Z" />
      
  <g transform="translate(114.0, 318.0) scale(1.4166666666666667)" fill="none" stroke="#2563EB" stroke-width="2">
    <path d="M5 7a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" />
    <path d="M3 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" />
    <path d="M16 3.13a4 4 0 0 1 0 7.75" />
    <path d="M21 21v-2a4 4 0 0 0 -3 -3.85" />
  </g>
      <text x="164" y="330" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="800" fill="#0B1F3A">Agent + Action Embedding</text>
      <text x="164" y="356" font-family="Consolas, Courier New, monospace" font-size="16" fill="#475569">agent_id embedding 16, previous action embedding 16</text>
    </g>
    <g id="layer-core">
      <path fill="#CCFBF1" stroke="#14B8A6" stroke-width="1.2" d="M98,404 H772 A8,8 0 0 1 780,412 V468 A8,8 0 0 1 772,476 H98 A8,8 0 0 1 90,468 V412 A8,8 0 0 1 98,404 Z" />
      
  <g transform="translate(114.0, 422.0) scale(1.4166666666666667)" fill="none" stroke="#14B8A6" stroke-width="2">
    <path d="M6 9a6 6 0 1 0 12 0a6 6 0 0 0 -12 0" />
    <path d="M12 3c1.333 .333 2 2.333 2 6s-.667 5.667 -2 6" />
    <path d="M12 3c-1.333 .333 -2 2.333 -2 6s.667 5.667 2 6" />
    <path d="M6 9h12" />
    <path d="M3 20h7" />
    <path d="M14 20h7" />
    <path d="M10 20a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" />
    <path d="M12 15v3" />
  </g>
      <text x="164" y="434" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="800" fill="#0B1F3A">Cascade Core + Q Head</text>
      <text x="164" y="460" font-family="Consolas, Courier New, monospace" font-size="16" fill="#475569">GRUCell hidden=128, Q head: 128 → 64 → 4, mask illegal actions</text>
    </g>
  </g>
  <g id="target-box">
    <path fill="#0B1F3A" d="M864,154 H1216 A8,8 0 0 1 1224,162 V536 A8,8 0 0 1 1216,544 H864 A8,8 0 0 1 856,536 V162 A8,8 0 0 1 864,154 Z" />
    <text x="890" y="202" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">Double DQN 目标</text>
    <text font-family="Consolas, Courier New, monospace" font-size="17" fill="#DBEAFE" x="890" y="254">a_next = CascadeArgmax</text><text font-family="Consolas, Courier New, monospace" font-size="17" fill="#DBEAFE" x="890" y="282">(Q_online, s_next)</text><text font-family="Consolas, Courier New, monospace" font-size="17" fill="#DBEAFE" x="890" y="326">y = r + gamma · (1-done)</text><text font-family="Consolas, Courier New, monospace" font-size="17" fill="#DBEAFE" x="890" y="354">· Q_target(s_next, a_next)</text><text font-family="Consolas, Courier New, monospace" font-size="17" fill="#DBEAFE" x="890" y="398">loss = mean Huber</text><text font-family="Consolas, Courier New, monospace" font-size="17" fill="#DBEAFE" x="890" y="426">(Q_online(s, prefix), y)</text><path fill="#DBEAFE" d="M896,462 H1180 A6,6 0 0 1 1186,468 V504 A6,6 0 0 1 1180,510 H896 A6,6 0 0 1 890,504 V468 A6,6 0 0 1 896,462 Z" />
    <text x="1038" y="493" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="800" fill="#0B1F3A" text-anchor="middle">所有级联位置共享同一 TD target</text>
  </g>
  <g id="hyperparams">
    <path fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" d="M126,584 H1154 A8,8 0 0 1 1162,592 V636 A8,8 0 0 1 1154,644 H126 A8,8 0 0 1 118,636 V592 A8,8 0 0 1 126,584 Z" />
    <text x="146" y="621" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="800" fill="#0B1F3A">初始超参：</text>
    <text x="252" y="621" font-family="Consolas, Courier New, monospace" font-size="17" fill="#475569">Adam · lr=1e-4 · gamma=0.99 · batch=256 · replay=100000 · warmup=5000 · target=1000 · clip=10</text>
  </g>
  <g id="footer">
    <text x="56" y="682" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#94A3B8">Source: MARL/network/cascade_net.py, MARL/policy/cascade_dqn.py</text>
    <text x="1224" y="682" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#94A3B8" text-anchor="end">06 / 10</text>
  </g>
</svg>