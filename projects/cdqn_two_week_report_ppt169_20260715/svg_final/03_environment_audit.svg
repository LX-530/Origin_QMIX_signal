  </g>
      <text x="714" y="294" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="800" fill="#111827">epsilon 退火过快</text>
      <text font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#475569" x="714" y="324">原配置 anneal_steps = 1，探索几乎一轮后降到 min_epsilon。</text><text font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#475569" x="714" y="350">24 智能体下各自随机会放大联合动作噪声。</text></g>
    <g id="risk-2">
      
  <g transform="translate(666.0, 384.0) scale(1.25)" fill="none" stroke="#E11D48" stroke-width="2">
    <path d="M12 9v4" />
    <path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0" />
    <path d="M12 16h.01" />
  </g>
      <text x="714" y="406" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="800" fill="#111827">更新 / 数据比过低</text>
      <text font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#475569" x="714" y="436">每轮采集约 28×150 = 4200 个环境步，但只训练 1 次。</text><text font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#475569" x="714" y="462">这会导致明显欠拟合，不应与算法本身混淆。</text></g>
    <g id="risk-3">
      
  <g transform="translate(666.0, 496.0) scale(1.25)" fill="none" stroke="#E11D48" stroke-width="2">
