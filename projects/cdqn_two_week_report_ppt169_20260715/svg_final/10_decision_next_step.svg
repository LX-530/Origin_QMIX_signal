    <text x="56" y="120" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#475569">CDQN 已经具备继续验证的工程基础，但是否替换 QMIX 必须由同预算实验决定。</text>
  </g>
  <g id="decision-gates">
