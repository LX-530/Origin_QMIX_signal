    <text x="500" y="336" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">同预算 5 seed 对比</text>
    <text font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#475569" x="500" y="378">原 QMIX</text><text font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#475569" x="500" y="406">修正 QMIX</text><text font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#475569" x="500" y="434">CDQN</text><path fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" d="M862,192 H1186 A8,8 0 0 1 1194,200 V444 A8,8 0 0 1 1186,452 H862 A8,8 0 0 1 854,444 V200 A8,8 0 0 1 862,192 Z" />
    
