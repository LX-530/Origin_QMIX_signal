    <text font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#475569" x="116" y="378">agent_cell_ids</text><text font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#475569" x="116" y="406">动作映射与 mask</text><text font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#475569" x="116" y="434">每个信号影响的 cell</text><path fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" d="M478,192 H802 A8,8 0 0 1 810,200 V444 A8,8 0 0 1 802,452 H478 A8,8 0 0 1 470,444 V200 A8,8 0 0 1 478,192 Z" />
    
  <g transform="translate(500.0, 224.0) scale(1.5833333333333333)" fill="none" stroke="#2563EB" stroke-width="2">
    <path d="M3 13a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -6" />
