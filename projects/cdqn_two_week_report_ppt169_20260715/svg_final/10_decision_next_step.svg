  <g id="footer">
    <text x="56" y="692" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#94A3B8">Decision rule: keep the corrected QMIX baseline until CDQN wins on comparable multi-seed evidence.</text>
