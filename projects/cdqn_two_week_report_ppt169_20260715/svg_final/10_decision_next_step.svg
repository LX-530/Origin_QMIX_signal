    <text x="640" y="562" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#DBEAFE" text-anchor="middle">CDQN 值得进入 24 智能体验证，但还不能宣称优于修正 QMIX。</text>
  </g>
  <g id="next-command">
    <text x="156" y="626" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="800" fill="#0B1F3A">服务器实验命令骨架</text>
    <text x="156" y="655" font-family="Consolas, Courier New, monospace" font-size="16" fill="#475569">python main.py --alg cascade_dqn --reward_norm --preset qmix_fixed</text>
