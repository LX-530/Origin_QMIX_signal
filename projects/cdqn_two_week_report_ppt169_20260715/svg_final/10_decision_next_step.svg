  <g id="final-callout">
    <path fill="#0B1F3A" d="M124,500 H1156 A8,8 0 0 1 1164,508 V566 A8,8 0 0 1 1156,574 H124 A8,8 0 0 1 116,566 V508 A8,8 0 0 1 124,500 Z" />
