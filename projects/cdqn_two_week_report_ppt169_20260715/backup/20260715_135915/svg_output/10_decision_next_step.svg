<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#F8FAFC"/>
  <g id="header">
    <text x="56" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" font-weight="800" fill="#0B1F3A">下一步：补齐 24 智能体定义后做服务器全量对比</text>
    <text x="56" y="120" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#475569">CDQN 已经具备继续验证的工程基础，但是否替换 QMIX 必须由同预算实验决定。</text>
  </g>
  <g id="decision-gates">
    <rect x="86" y="192" width="340" height="260" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <use data-icon="tabler-outline/users" x="116" y="224" width="38" height="38" fill="#E11D48" stroke-width="2"/>
    <text x="116" y="298" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="800" fill="#0B1F3A">Gate 1</text>
    <text x="116" y="336" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">补齐 24 智能体定义</text>
    <text x="116" y="378" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#475569">
      <tspan x="116" dy="0">agent_cell_ids</tspan>
      <tspan x="116" dy="28">动作映射与 mask</tspan>
      <tspan x="116" dy="28">每个信号影响的 cell</tspan>
    </text>
    <rect x="470" y="192" width="340" height="260" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <use data-icon="tabler-outline/chart-bar" x="500" y="224" width="38" height="38" fill="#2563EB" stroke-width="2"/>
    <text x="500" y="298" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="800" fill="#0B1F3A">Gate 2</text>
    <text x="500" y="336" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">同预算 5 seed 对比</text>
    <text x="500" y="378" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#475569">
      <tspan x="500" dy="0">原 QMIX</tspan>
      <tspan x="500" dy="28">修正 QMIX</tspan>
      <tspan x="500" dy="28">CDQN</tspan>
    </text>
    <rect x="854" y="192" width="340" height="260" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <use data-icon="tabler-outline/target" x="884" y="224" width="38" height="38" fill="#14B8A6" stroke-width="2"/>
    <text x="884" y="298" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="800" fill="#0B1F3A">Gate 3</text>
    <text x="884" y="336" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">按指标决定是否替换</text>
    <text x="884" y="378" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#475569">
      <tspan x="884" dy="0">完成率不差</tspan>
      <tspan x="884" dy="28">疏散步数更短</tspan>
      <tspan x="884" dy="28">火灾暴露不恶化</tspan>
    </text>
  </g>
  <g id="final-callout">
    <rect x="116" y="500" width="1048" height="74" rx="8" fill="#0B1F3A"/>
    <text x="640" y="532" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">当前结论</text>
    <text x="640" y="562" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#DBEAFE" text-anchor="middle">CDQN 值得进入 24 智能体验证，但还不能宣称优于修正 QMIX。</text>
  </g>
  <g id="next-command">
    <text x="156" y="626" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="800" fill="#0B1F3A">服务器实验命令骨架</text>
    <text x="156" y="655" font-family="Consolas, Courier New, monospace" font-size="16" fill="#475569">python main.py --alg cascade_dqn --reward_norm --preset qmix_fixed</text>
  </g>
  <g id="footer">
    <text x="56" y="692" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#94A3B8">Decision rule: keep the corrected QMIX baseline until CDQN wins on comparable multi-seed evidence.</text>
    <text x="1224" y="692" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#94A3B8" text-anchor="end">10 / 10</text>
  </g>
</svg>
